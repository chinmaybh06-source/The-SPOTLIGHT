
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Spotlight</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #641D32;
    color: #F8F0E9;
    font-family: Georgia, serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    transition: background 1.2s ease;
}

.container {
    padding: 25px;
    animation: appear 1.2s ease;
}

h1 {
    font-size: clamp(28px, 6vw, 46px);
    font-weight: 400;
    letter-spacing: -1px;
    margin-bottom: 38px;
}

button {
    background: #F8F0E9;
    color: #641D32;
    border: none;
    padding: 17px 32px;
    font-size: 12px;
    letter-spacing: 2px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
}

button:hover {
    background: white;
    transform: translateY(-3px);
}

body.active {
    background: #100D0E;
}

.message {
    display: none;
    max-width: 650px;
    padding: 30px;
    font-size: clamp(25px, 5vw, 42px);
    line-height: 1.5;
    font-weight: 400;
    opacity: 0;
}

body.active .container {
    display: none;
}

body.active .message {
    display: block;
    animation: spotlight 2s ease forwards;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes spotlight {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>No mistakes in spotlight</h1>
    <button onclick="enterSpotlight()">
        ENTER THE SPOTLIGHT
    </button>
</div>

<div class="message">
    You were never supposed to be perfect.
    <br>
    You were supposed to be prepared.
</div>

<script>
function enterSpotlight() {
    document.body.classList.add("active");
}
</script>

</body>
</html>
